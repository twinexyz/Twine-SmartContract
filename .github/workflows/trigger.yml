name: Trigger Weaver Workflow

on:
  push:
    branches:
      - feat/ci-fixes
      - main

env:
  REPO: weaver
  ORG: ${{ github.repository_owner }}

jobs:
  trigger:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Trigger Weaver workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${{ secrets.TRIGGER_GH_PAT }}" \
            https://api.github.com/repos/${{ env.ORG }}/${{ env.REPO }}/dispatches \
            -d '{"event_type":"trigger_changes"}'
